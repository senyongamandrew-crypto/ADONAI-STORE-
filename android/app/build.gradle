apply plugin: 'com.android.application'

// ---------------------------------------------------------------------------
// Signing configuration
// An APK MUST be signed or Android refuses to install it ("App not installed").
// Release signing uses a keystore supplied through env vars / gradle props:
//   ADONAI_KEYSTORE_FILE, ADONAI_KEYSTORE_PASSWORD, ADONAI_KEY_ALIAS, ADONAI_KEY_PASSWORD
// If none is supplied, the release build falls back to the debug keystore so the
// artifact is still installable for internal testing (NOT for Play Store upload).
// ---------------------------------------------------------------------------
def keystoreFilePath = System.getenv('ADONAI_KEYSTORE_FILE') ?: project.findProperty('ADONAI_KEYSTORE_FILE')
def keystorePassword = System.getenv('ADONAI_KEYSTORE_PASSWORD') ?: project.findProperty('ADONAI_KEYSTORE_PASSWORD')
def keyAliasName = System.getenv('ADONAI_KEY_ALIAS') ?: project.findProperty('ADONAI_KEY_ALIAS')
def keyPasswordValue = System.getenv('ADONAI_KEY_PASSWORD') ?: project.findProperty('ADONAI_KEY_PASSWORD')
def hasReleaseKeystore = keystoreFilePath != null && file(keystoreFilePath).exists()
// Safe installation candidate: no signing-key conflict or overwrite of an existing app.
def previewBuild = System.getenv('ADONAI_PREVIEW_BUILD') == '1'
// ---------------------------------------------------------------------------
// App target: ONE native shell, TWO separately installable applications.
//   ADONAI_APP_TARGET=pos      (default) -> Adonai POS      com.adonaithrift.pos
//   ADONAI_APP_TARGET=delivery           -> Adonai Delivery com.adonaithrift.delivery
// The delivery build bundles the rider-partner web app (delivery.html) and
// opens straight into it (see BuildConfig.DELIVERY_APP in MainActivity); it is
// NOT the POS register with a different label. Preview builds of either app
// get a ".preview" applicationId and a "Preview" label so they install
// alongside the real app. A POS preview must never be labelled "Adonai
// Delivery" — that mislabelling is what sent riders the cashier app.
// ---------------------------------------------------------------------------
def appTarget = (System.getenv('ADONAI_APP_TARGET') ?: 'pos').toLowerCase()
def deliveryBuild = appTarget == 'delivery'
def targetApplicationId = deliveryBuild
        ? (previewBuild ? "com.adonaithrift.delivery.preview" : "com.adonaithrift.delivery")
        : (previewBuild ? "com.adonaithrift.pos.preview" : "com.adonaithrift.pos")
def targetAppLabel = deliveryBuild
        ? (previewBuild ? "Adonai Delivery Preview" : "Adonai Delivery")
        : (previewBuild ? "Adonai POS Preview" : "@string/app_name")
def targetAppIcon = deliveryBuild ? "@mipmap/ic_launcher_delivery" : "@mipmap/ic_launcher"
def targetAppRoundIcon = deliveryBuild ? "@mipmap/ic_launcher_delivery_round" : "@mipmap/ic_launcher_round"

android {
    namespace "com.adonaithrift.pos"
    compileSdk 34

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId targetApplicationId
        minSdk 22
        targetSdk 34
        versionCode 20500
        versionName previewBuild ? "2.5.0-preview" : "2.5.0"
        buildConfigField "boolean", "DELIVERY_APP", deliveryBuild ? "true" : "false"
        buildConfigField "String", "APP_TARGET", "\"${deliveryBuild ? 'delivery' : 'pos'}\""
        manifestPlaceholders = [adonaiAppLabel: targetAppLabel, adonaiAppIcon: targetAppIcon, adonaiAppRoundIcon: targetAppRoundIcon]

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    androidResources {
        // Files and dirs to omit from the packaged assets inside the APK
        ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
    }

    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile file(keystoreFilePath)
                storePassword keystorePassword
                keyAlias keyAliasName
                keyPassword keyPasswordValue
                enableV1Signing true
                enableV2Signing true
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig hasReleaseKeystore ? signingConfigs.release : signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

repositories {
    google()
    mavenCentral()
    flatDir {
        dirs 'libs'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.9.0'
}
