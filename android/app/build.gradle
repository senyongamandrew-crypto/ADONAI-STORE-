plugins {
    id 'com.android.application'
}

android {
    namespace 'com.adonaithrift.pos'
    compileSdk 34

    defaultConfig {
        applicationId 'com.adonaithrift.pos'
        minSdk 22
        targetSdk 34
        versionCode 20400
        versionName '2.4.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
        vectorDrawables.useSupportLibrary = true
    }

    // A debug signing key makes the CI artifact installable without checking a
    // private production keystore into the repository. Production builds can
    // override this with RELEASE_STORE_FILE, RELEASE_STORE_PASSWORD,
    // RELEASE_KEY_ALIAS, and RELEASE_KEY_PASSWORD Gradle properties.
    def releaseStoreFile = project.findProperty('RELEASE_STORE_FILE') ?: System.getenv('RELEASE_STORE_FILE')
    def releaseStorePassword = project.findProperty('RELEASE_STORE_PASSWORD') ?: System.getenv('RELEASE_STORE_PASSWORD')
    def releaseKeyAlias = project.findProperty('RELEASE_KEY_ALIAS') ?: System.getenv('RELEASE_KEY_ALIAS')
    def releaseKeyPassword = project.findProperty('RELEASE_KEY_PASSWORD') ?: System.getenv('RELEASE_KEY_PASSWORD')

    signingConfigs {
        release {
            if (releaseStoreFile) {
                storeFile = file(releaseStoreFile)
                storePassword = releaseStorePassword ?: ''
                keyAlias = releaseKeyAlias ?: ''
                keyPassword = releaseKeyPassword ?: ''
            }
        }
    }

    buildTypes {
        release {
            // The default keeps the downloadable APK installable. Supplying a
            // keystore property above automatically switches to a production
            // signing key in the same Gradle invocation.
            signingConfig signingConfigs.debug
            if (releaseStoreFile) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packagingOptions {
        resources {
            excludes += ['/META-INF/LICENSE.md', '/META-INF/LICENSE-notice.md']
        }
    }
}

repositories {
    flatDir {
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.coordinatorlayout:coordinatorlayout:1.2.0'
    implementation 'androidx.core:core-splashscreen:1.0.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.webkit:webkit:1.9.0'
}
