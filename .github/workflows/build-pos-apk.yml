name: Adonai POS Android APK Build & CI Pipeline

on:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release Tag (e.g. v2.4.0)'
        required: false
        type: string
        default: 'v2.4.0'

permissions:
  contents: write
  packages: write

jobs:
  backend-tests:
    name: 🧪 Backend Test Suite & Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Backend Integration & Security Tests
        run: |
          python test_render_postgres.py

  build-pos-apk:
    name: 📱 Build & Package Android POS APK
    runs-on: ubuntu-latest
    needs: backend-tests
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # AGP 8.2.1 is not compatible with Gradle 9.x (preinstalled on the runner),
      # so pin Gradle 8.6 and generate a wrapper the build can reuse.
      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Generate Gradle Wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.6

      - name: Show Toolchain Versions
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Bundle POS Web Assets into Native Project
        run: npm run bundle:pos

      - name: Decode Release Keystore (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret set — the build will generate a local signing key."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/adonai-release.keystore"
          {
            echo "ADONAI_KEYSTORE_FILE=$RUNNER_TEMP/adonai-release.keystore"
            echo "ADONAI_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ADONAI_KEY_ALIAS=$KEY_ALIAS"
            echo "ADONAI_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Compile Signed Release APK
        id: release_build
        run: |
          set -o pipefail
          npm run build:apk 2>&1 | tee /tmp/release-build.log

      - name: Report Build Failure
        if: failure()
        run: |
          echo "::group::Build log tail"
          tail -120 /tmp/release-build.log || true
          echo "::endgroup::"
          MSG=$(grep -A 20 -m1 -E "What went wrong|error:" /tmp/release-build.log | head -40 | tr '\n' '~' || true)
          echo "::error title=Gradle build failed::${MSG}"

      - name: Compile Debug APK
        run: npm run build:apk:debug

      - name: Verify APKs are installable (signature + structure)
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for f in dist/adonai-pos-v2.apk dist/adonai-pos-v2-debug.apk; do
            echo "=== $f"
            test -s "$f"
            unzip -l "$f" | grep -q classes.dex
            unzip -l "$f" | grep -q resources.arsc
            "$BT/aapt2" dump badging "$f" | head -5
            "$BT/apksigner" verify --verbose "$f"
          done

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: adonai-pos-v2-apk
          path: dist/adonai-pos-v2.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: adonai-pos-v2-debug-apk
          path: dist/adonai-pos-v2-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release & Attach APK
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: "Adonai POS ${{ github.event.inputs.release_tag || github.ref_name }}"
          draft: false
          prerelease: false
          files: |
            dist/adonai-pos-v2.apk
            dist/adonai-pos-v2-debug.apk
          body: |
            ## Adonai Store — Android POS APK Release

            ### 📦 Download & Installation
            - **Direct APK**: `adonai-pos-v2.apk` (signed release build)
            - **Package ID**: `com.adonaithrift.pos`
            - **Min Android**: 5.1 (API 22) · **Target**: API 34
            - Enable "Install unknown apps" for your browser/file manager, then tap the APK.

            ### ✨ Features
            - Offline SQLite & local cache sync
            - Barcode & SKU lookup
            - Camera intake & photo compression
            - Cash & MTN / Airtel MoMo tender settlement
            - 80mm thermal receipt printing
            - Outbound one-way navigation to live web storefront (`https://adonaithrift.ug`)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
