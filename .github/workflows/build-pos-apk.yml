name: Adonai POS Android APK Build & CI Pipeline

on:
  push:
    branches:
      - main
      - 'arena/**'
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release'
        required: false
        type: boolean
        default: false
      release_tag:
        description: 'Release Tag (e.g. v2.4.0)'
        required: false
        type: string
        default: 'v2.5.0'

concurrency:
  group: pos-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

# Branch/PR install candidates use a separate app ID: existing app data is safe.
env:
  ADONAI_PREVIEW_BUILD: ${{ (startsWith(github.ref, 'refs/heads/arena/') || github.event_name == 'pull_request' || contains(github.ref, '-preview.')) && '1' || '0' }}

jobs:
  backend-tests:
    name: 🧪 Backend Test Suite & Health Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Responsive Product Image Manifest
        run: |
          pip install pillow
          python scripts/optimize-product-images.py --check

      - name: Run Backend Integration & Security Tests
        run: |
          python test_render_postgres.py
          python -m unittest discover -s tests -p test_notifications.py -v
          python -m unittest discover -s tests -p test_product_media.py -v
          python -m unittest discover -s tests -p test_audit_exports.py -v
          python -m unittest discover -s tests -p test_dispatch.py -v
          python -m unittest discover -s tests -p test_apk_packaging.py -v
          python tests/test_multi_tier_grading.py
          python tests/test_consignment.py

  frontend-tests:
    name: Web and phone-interface regressions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm test

  build-pos-apk:
    name: 📱 Build & Package Android POS APK
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      # AGP 8.2.1 is not compatible with Gradle 9.x (preinstalled on the runner),
      # so pin Gradle 8.6 and generate a wrapper the build can reuse.
      - name: Set up Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Generate Gradle Wrapper
        working-directory: android
        run: gradle wrapper --gradle-version 8.6

      - name: Show Toolchain Versions
        run: |
          java -version
          gradle --version
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Bundle POS Web Assets into Native Project
        run: npm run bundle:pos

      - name: Decode Release Keystore (if configured)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 secret set — the build will generate a local signing key."
            exit 0
          fi
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/adonai-release.keystore"
          {
            echo "ADONAI_KEYSTORE_FILE=$RUNNER_TEMP/adonai-release.keystore"
            echo "ADONAI_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "ADONAI_KEY_ALIAS=$KEY_ALIAS"
            echo "ADONAI_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Compile Signed Release APK
        id: release_build
        run: |
          set -o pipefail
          npm run build:apk 2>&1 | tee /tmp/release-build.log

      - name: Report Build Failure
        if: failure()
        run: |
          echo "::group::Build log tail"
          tail -120 /tmp/release-build.log || true
          echo "::endgroup::"
          MSG=$(grep -A 20 -m1 -E "What went wrong|error:" /tmp/release-build.log | head -40 | tr '\n' '~' || true)
          echo "::error title=Gradle build failed::${MSG}"

      - name: Compile Debug APK
        run: npm run build:apk:debug

      - name: Verify APKs are installable (signature + structure)
        run: |
          set -e
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for f in dist/adonai-pos-v2.apk dist/adonai-pos-v2-debug.apk; do
            echo "=== $f"
            test -s "$f"
            unzip -l "$f" | grep -q classes.dex
            unzip -l "$f" | grep -q resources.arsc
            "$BT/aapt2" dump badging "$f" | head -5
            "$BT/apksigner" verify --verbose "$f"
          done

      - name: Verify packaged rider service and create installation metadata
        run: |
          python scripts/verify-pos-apk.py dist/adonai-pos-v2.apk

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: adonai-pos-v2-apk
          path: |
            dist/adonai-pos-v2.apk
            dist/adonai-pos-v2.5.0-preview.apk
            dist/SHA256SUMS.txt
            dist/BUILD-INFO.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: adonai-pos-v2-debug-apk
          path: dist/adonai-pos-v2-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Name installation release
        id: install_release
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true') || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/'))
        env:
          REQUESTED_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ "$GITHUB_EVENT_NAME" == workflow_dispatch && -n "$REQUESTED_TAG" ]]; then
            TAG="$REQUESTED_TAG"
          else
            TAG="v2.5.0-preview.$GITHUB_RUN_NUMBER"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release & Attach APK
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true') || (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/'))
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.install_release.outputs.tag }}
          name: "Adonai POS ${{ steps.install_release.outputs.tag }}"
          target_commitish: ${{ github.sha }}
          draft: false
          prerelease: ${{ env.ADONAI_PREVIEW_BUILD == '1' }}
          files: |
            dist/adonai-pos-v2.apk
            dist/adonai-pos-v2.5.0-preview.apk
            dist/SHA256SUMS.txt
            dist/BUILD-INFO.json
          body: |
            ## Adonai Store — installation-ready Android build

            Download the signed **adonai-pos-v2.5.0-preview.apk** for a branch
            installation candidate, or **adonai-pos-v2.apk** for a normal build.
            Allow "Install unknown apps" for your browser/Files and open the APK.
            You do not need Android Studio or any build tools on your phone.

            Branch builds are labelled **Adonai Store Preview** and install
            alongside the existing POS, not over it. Do not uninstall your
            existing app or clear its data. No unsynced phone data is copied.
            Use a device already assigned to you or pair an authorized rider.

            Includes server-saved delivery partners/manual dispatch, native
            explicit Start/Stop location foreground service, 12-hour duties,
            secure pairing, freshness/accuracy/simulated labels, recipient
            delivery updates, receipt printing, spreadsheet exports and
            garment media/tag scanning. The cashier remains open; sensitive
            GPS access requires the configured private Orders protection.

            The **updated backend must also be deployed** to the store HTTPS
            origin before pairing/dispatch endpoints can work. This build does
            not itself deploy the backend or alter your live store database.
            Physical-device screen-lock/GPS and printer checks remain necessary.
            APK compile, package content and signature verification are checked
            by this workflow; checksums/build identity accompany the download.
            Minimum Android 5.1 (API 22); target API 34.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
